<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Eleições Paraipaba · Votação por bairro e seção</title>
  <meta name="description" content="Consulta de votos por município, bairro, local de votação e seção eleitoral no Ceará, e mapeamento de lideranças para 2026.">
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <link rel="stylesheet" href="css/style.css">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5"/><path d="M5 10v10h14V10"/></symbol>
      <symbol id="i-users" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7"/><path d="M17.5 13.5a6.5 6.5 0 0 1 4 6.5"/></symbol>
      <symbol id="i-flag" viewBox="0 0 24 24"><path d="M5 21V4"/><path d="M5 4h12l-2 4 2 4H5"/></symbol>
      <symbol id="i-building" viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="1.5"/><path d="M9 7h2M13 7h2M9 11h2M13 11h2M9 15h2M13 15h2M10 21v-3h4v3"/></symbol>
      <symbol id="i-map" viewBox="0 0 24 24"><path d="M3 6l6-2 6 2 6-2v14l-6 2-6-2-6 2z"/><path d="M9 4v14M15 6v14"/></symbol>
      <symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 21s-6-5.5-6-11a6 6 0 0 1 12 0c0 5.5-6 11-6 11z"/><circle cx="12" cy="10" r="2.2"/></symbol>
      <symbol id="i-chart" viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/></symbol>
      <symbol id="i-vote" viewBox="0 0 24 24"><path d="M4 12h16v8H4z"/><path d="M8 12V5h8v7"/><path d="m10 8 1.5 1.5L14.5 6"/></symbol>
      <symbol id="i-trophy" viewBox="0 0 24 24"><path d="M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M7 6H4a3 3 0 0 0 3 4M17 6h3a3 3 0 0 1-3 4M12 14v4M8 20h8"/></symbol>
      <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></symbol>
      <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></symbol>
      <symbol id="i-left" viewBox="0 0 24 24"><path d="m15 6-6 6 6 6"/></symbol>
      <symbol id="i-right" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></symbol>
    </defs>
  </svg>

  <div class="app">
    <aside class="lateral">
      <div class="marca">
        <span class="logo" aria-hidden="true">CE</span>
        <span class="marca-nome">Eleições Ceará</span>
      </div>

      <nav class="nav" aria-label="Eleição e cargos">
        <div class="nav-titulo">Eleição</div>
        <div id="nav-eleicoes" class="nav-lista"></div>
      </nav>

      <div class="campo campo-municipio">
        <label for="sel-municipio" class="rotulo">Município</label>
        <select id="sel-municipio" aria-label="Município"></select>
      </div>

      <nav class="nav" aria-label="Consulta">
        <div class="nav-titulo">Consulta</div>
        <div id="nav-telas" class="nav-lista">
          <button type="button" class="nav-item ativo" data-tela="tabela">
            <svg class="icone"><use href="#i-chart"/></svg><span>Tabelas</span>
          </button>
          <button type="button" class="nav-item" data-tela="mapa">
            <svg class="icone"><use href="#i-map"/></svg><span>Mapa por bairro</span>
          </button>
        </div>
        <div class="nav-titulo">Eleições 2026</div>
        <div id="nav-2026" class="nav-lista">
          <button type="button" class="nav-item" data-tela="liderancas">
            <svg class="icone"><use href="#i-users"/></svg><span>Lideranças</span>
          </button>
          <button type="button" class="nav-item" data-tela="estimativa">
            <svg class="icone"><use href="#i-trophy"/></svg><span>Estimativa</span>
          </button>
          <button type="button" class="nav-item" data-tela="candidatos26">
            <svg class="icone"><use href="#i-flag"/></svg><span>Candidatos 2026</span>
          </button>
        </div>
      </nav>

      <div class="lateral-rodape">
        <label class="busca">
          <svg class="icone"><use href="#i-search"/></svg>
          <input id="inp-busca" type="search" placeholder="Buscar candidato" autocomplete="off" aria-label="Buscar candidato por nome, número ou partido">
        </label>
      </div>
    </aside>

    <main class="conteudo">
      <div class="barra-topo">
        <button id="btn-voltar" type="button" class="btn-icone" title="Voltar"><svg class="icone"><use href="#i-left"/></svg></button>
        <button id="btn-avancar" type="button" class="btn-icone" title="Avançar"><svg class="icone"><use href="#i-right"/></svg></button>
        <span class="separador"></span>
        <nav id="trilha" class="trilha" aria-label="Localização"></nav>
      </div>

      <section class="filtros" aria-label="Filtros">
        <div class="campo campo-grande">
          <label for="sel-candidato">Candidato</label>
          <select id="sel-candidato"><option value="">Todos (ranking de candidatos)</option></select>
        </div>
        <div class="campo">
          <label for="sel-bairro">Bairro</label>
          <select id="sel-bairro"><option value="">Todo o município</option></select>
        </div>
        <div id="campo-por" class="campo">
          <span class="rotulo">Ver por</span>
          <div class="segmentado" role="radiogroup" aria-label="Agrupar por">
            <label><input type="radio" name="por" value="bairro" checked><span>Bairro</span></label>
            <label><input type="radio" name="por" value="local"><span>Local</span></label>
            <label><input type="radio" name="por" value="secao"><span>Seção</span></label>
          </div>
        </div>
        <div class="campo campo-acoes">
          <button id="btn-limpar" type="button" class="btn">Limpar filtros</button>
        </div>
      </section>

      <p id="status" class="status" role="status">Carregando dados…</p>

      <section id="resumo" class="cards" aria-label="Resumo"></section>

      <div id="grade-mapa" class="grade grade-mapa" hidden>
        <section class="painel painel-mapa">
          <div class="painel-cabecalho">
            <h2 id="titulo-mapa">Mapa por bairro</h2>
            <span id="dica-mapa" class="dica"></span>
          </div>
          <div id="mapa-aviso" class="vazio" hidden></div>
          <div id="mapa" class="mapa" role="application" aria-label="Mapa dos bairros do município"></div>
          <div id="legenda-mapa" class="legenda-mapa"></div>
        </section>
        <section class="painel painel-bairro">
          <div class="painel-cabecalho"><h2 id="titulo-bairro">Bairro</h2></div>
          <div id="detalhe-bairro" class="detalhe-bairro"></div>
        </section>
      </div>

      <div id="tela-liderancas" class="tela-liderancas" hidden></div>

      <div id="grade-tabela" class="grade sem-destaques">
        <section class="painel painel-tabela">
          <div class="painel-cabecalho">
            <h2 id="titulo-tabela">Resultados</h2>
            <span id="dica-tabela" class="dica"></span>
          </div>
          <div class="tabela-scroll">
            <table id="tabela">
              <thead></thead>
              <tbody></tbody>
              <tfoot></tfoot>
            </table>
          </div>
        </section>
      </div>

      <footer class="rodape">
        <p id="fonte"></p>
        <p>Dados abertos do TSE/TRE-CE · projeto de código aberto no <a id="link-repo" href="#" rel="noopener">GitHub</a>.</p>
      </footer>
    </main>
  </div>

  <script src="js/csv.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js" crossorigin=""></script>
  <script src="js/sync.js"></script>
  <script src="js/liderancas.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
